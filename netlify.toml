[build]
  publish = "dist/spa"
  command = "npm run build"

# Para HASH MODE - NÃO redirecione tudo para index.html
# Apenas redirecione 404s
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Headers para cache
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"